<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; }
  body { width: 1080px; height: 1080px; background: #f2e4e1; display: flex; align-items: center; justify-content: center; }
  svg { display: block; }
  text { fill: #4d2228; }
  .ar { font-family: 'Amiri', serif; }
  .lat { font-family: 'Cormorant Garamond', serif; }
</style>
</head>
<body>
<svg width="1000" height="1000" viewBox="0 0 250 250">

  <!-- Parenthèses latérales — même cercle que le texte (centre 125,120 · r 106) -->
  <path d="M 32 72 A 108 108 0 0 0 32 168" stroke="#4d2228" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M 218 72 A 108 108 0 0 1 218 168" stroke="#4d2228" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Cœur en chemin — plus haut que large -->
  <g transform="translate(125 110) scale(0.98 1.12) translate(-100 -103)">
    <path d="M 100 165 C 55 130, 30 95, 38 68 C 44 47, 68 40, 84 52 C 92 58, 98 67, 100 76 C 102 67, 108 58, 116 52 C 132 40, 156 47, 162 68 C 169 93, 150 124, 112 155"
          stroke="#4d2228" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M 106.5 159 l 2.2 5 5 2.2 -5 2.2 -2.2 5 -2.2 -5 -5 -2.2 5 -2.2 z" fill="#b8956a"/>
  </g>

  <!-- Verset 13:28 — réel, avec tashkeel -->
  <g class="ar" text-anchor="middle">
    <text x="125" y="96" font-size="13">أَلَا بِذِكْرِ</text>
    <text x="125" y="126" font-size="24" font-weight="700">اللَّهِ</text>
    <text x="125" y="152" font-size="12">تَطْمَئِنُّ الْقُلُوبُ</text>
  </g>

  <!-- Reset ton cœur en arc — même cercle -->
  <defs><path id="arcbas" d="M 24 144 A 108 108 0 0 0 226 144"/></defs>
  <text class="lat" font-size="16.5" letter-spacing="1.5" font-weight="500">
    <textPath href="#arcbas" startOffset="50%" text-anchor="middle">Reset ton cœur</textPath>
  </text>

</svg>
</body>
</html>
